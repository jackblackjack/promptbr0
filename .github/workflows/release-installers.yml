name: Release installers

# Builds the desktop installers for a release tag and keeps them as workflow
# artifacts. Publication is deliberately manual: a maintainer downloads the
# staged files and attaches exactly those to the GitHub Release. Nothing is
# tagged, released or code-signed here.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Hosted runners carry no Developer ID certificate. Disable identity
  # auto-discovery so every macOS build is reproducibly unsigned instead of
  # depending on whatever keychain the runner image happens to have.
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  linux-x64:
    name: Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers
        run: pnpm --filter @promptbr0/desktop dist -- --linux

      - name: Verify packaged architecture
        run: node apps/desktop/scripts/verify-release-architecture.mjs --platform linux --arch x64 --dist apps/desktop/dist

      - name: Stage canonical installers
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
          node apps/desktop/scripts/collect-release-installers.mjs --platform linux --arch x64 --version "$version" --dist apps/desktop/dist --out staged

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-linux-x64
          path: staged/*
          if-no-files-found: error

